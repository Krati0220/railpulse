<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77e2bb"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#070b17"/>

  <!-- title -->
  <text x="70" y="82" fill="#eaf0ff" font-size="44" font-weight="700" letter-spacing="-1.2">Where the model is allowed to be</text>
  <text x="70" y="122" fill="#94a1bf" font-size="22">Two surfaces, each behind a gate. Everything that moves money is a state machine.</text>

  <!-- ============ LEFT: model surfaces ============ -->
  <text x="70" y="192" fill="#78a7ff" font-size="15" font-weight="700" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A MODEL MAY TOUCH THIS</text>

  <rect x="70" y="212" width="450" height="212" rx="12" fill="#78a7ff" fill-opacity="0.10" stroke="#78a7ff" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="102" y="268" fill="#78a7ff" font-size="31" font-weight="700">Classify</text>
  <text x="102" y="311" fill="#eaf0ff" font-size="21">Messy issuer text becomes</text>
  <text x="102" y="341" fill="#eaf0ff" font-size="21">one of 10 fixed codes,</text>
  <text x="102" y="371" fill="#eaf0ff" font-size="21">with a confidence.</text>
  <text x="102" y="403" fill="#6e7c9c" font-size="16">Only reached for prose a lookup can't answer.</text>

  <rect x="70" y="452" width="450" height="212" rx="12" fill="#78a7ff" fill-opacity="0.10" stroke="#78a7ff" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="102" y="508" fill="#78a7ff" font-size="31" font-weight="700">Draft</text>
  <text x="102" y="551" fill="#eaf0ff" font-size="21">Language, tone, message body.</text>
  <text x="102" y="583" fill="#77e2bb" font-size="21" font-weight="600">No URL field. No amount field.</text>
  <text x="102" y="627" fill="#6e7c9c" font-size="16">A jailbreak has nowhere to put a payload.</text>

  <!-- ============ GATES ============ -->
  <line x1="530" y1="318" x2="566" y2="318" stroke="#77e2bb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="530" y1="558" x2="566" y2="558" stroke="#77e2bb" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="574" y="212" width="186" height="212" rx="12" fill="#101a31" stroke="#77e2bb" stroke-width="2.5"/>
  <text x="667" y="262" fill="#77e2bb" font-size="19" font-weight="700" letter-spacing="3.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GATE</text>
  <text x="667" y="308" fill="#eaf0ff" font-size="19" text-anchor="middle">In the enum?</text>
  <text x="667" y="340" fill="#eaf0ff" font-size="19" text-anchor="middle">Confidence</text>
  <text x="667" y="368" fill="#eaf0ff" font-size="19" text-anchor="middle">≥ 0.60?</text>
  <text x="667" y="402" fill="#6e7c9c" font-size="15" text-anchor="middle">else: no answer</text>

  <rect x="574" y="452" width="186" height="212" rx="12" fill="#101a31" stroke="#77e2bb" stroke-width="2.5"/>
  <text x="667" y="502" fill="#77e2bb" font-size="19" font-weight="700" letter-spacing="3.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GATE</text>
  <text x="667" y="546" fill="#eaf0ff" font-size="19" text-anchor="middle">No model URL</text>
  <text x="667" y="576" fill="#eaf0ff" font-size="19" text-anchor="middle">No invented offer</text>
  <text x="667" y="606" fill="#eaf0ff" font-size="19" text-anchor="middle">No coercion</text>
  <text x="667" y="640" fill="#6e7c9c" font-size="15" text-anchor="middle">preview only</text>

  <line x1="770" y1="318" x2="806" y2="318" stroke="#77e2bb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="770" y1="558" x2="806" y2="558" stroke="#77e2bb" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ============ RIGHT: the engine ============ -->
  <rect x="814" y="212" width="716" height="452" rx="14" fill="#101a31" stroke="#77e2bb" stroke-width="3"/>
  <text x="848" y="258" fill="#77e2bb" font-size="16" font-weight="700" letter-spacing="3.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DETERMINISTIC ENGINE</text>
  <text x="848" y="304" fill="#eaf0ff" font-size="33" font-weight="700" letter-spacing="-0.6">Every rupee is decided here.</text>
  <line x1="848" y1="330" x2="1496" y2="330" stroke="#26334f" stroke-width="1.5"/>

  <text x="848" y="368" fill="#94a1bf" font-size="19">For each failed payment it picks exactly one of five:</text>

  <g font-size="22">
    <circle cx="854" cy="404" r="4" fill="#77e2bb"/>
    <text x="876" y="411" fill="#eaf0ff">wait for the rail to come back</text>

    <circle cx="854" cy="444" r="4" fill="#77e2bb"/>
    <text x="876" y="451" fill="#eaf0ff">let the provider's retry window run</text>

    <circle cx="854" cy="484" r="4" fill="#77e2bb"/>
    <text x="876" y="491" fill="#eaf0ff">ask the customer for a consented link</text>

    <circle cx="854" cy="524" r="4" fill="#77e2bb"/>
    <text x="876" y="531" fill="#eaf0ff">stop</text>

    <circle cx="854" cy="564" r="4" fill="#f7c55d"/>
    <text x="876" y="571" fill="#f7c55d">ask a human — including when the model wasn't sure</text>
  </g>

  <line x1="848" y1="596" x2="1496" y2="596" stroke="#26334f" stroke-width="1.5"/>
  <text x="848" y="626" fill="#94a1bf" font-size="17">12-state machine · 2 contacts per 7 days per customer · opt-out is permanent</text>
  <text x="848" y="650" fill="#94a1bf" font-size="17">every action claimed in a durable ledger before it happens</text>

  <!-- ============ RESULT STRIP ============ -->
  <line x1="70" y1="722" x2="1530" y2="722" stroke="#26334f" stroke-width="1.5"/>
  <text x="70" y="778" fill="#77e2bb" font-size="46" font-weight="700" letter-spacing="-1">+₹66,409</text>
  <text x="308" y="768" fill="#eaf0ff" font-size="21">net recovered vs static dunning, per 500 failed payments</text>
  <text x="308" y="797" fill="#94a1bf" font-size="21">Won 12 of 12 worlds. 0 customers opted out, against its 217.</text>

  <text x="1530" y="768" fill="#78a7ff" font-size="17" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">python -m app.sim.report</text>
  <text x="1530" y="795" fill="#6e7c9c" font-size="17" text-anchor="end">38 seconds. No API key. Run it yourself.</text>

  <text x="70" y="852" fill="#6e7c9c" font-size="16">Take the classifier out and the same engine loses to plain retry-with-backoff. That row is left in the results table.</text>
</svg>
