[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railpulse"
version = "0.2.0"
description = "Consent-aware subscription recovery state engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI dependency defaults are the documented idiom
  "RUF012",  # mutable class attributes are intentional in the policy validator
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Devanagari and Hinglish message templates are single long string literals.
"app/ai_copilot.py" = ["E501"]
# The report deliberately uses typographic dashes and the rupee sign.
"app/benchmark.py" = ["RUF001"]

[tool.coverage.run]
source = ["app"]
omit = ["app/benchmark.py"]
